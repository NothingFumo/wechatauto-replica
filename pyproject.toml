[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatauto-replica"
version = "1.0.2"
description = "Windows版本微信客户端（非网页版）自动化，复刻版，支持当前微信4.x客户端"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "wechatauto-replica" }]
keywords = ["wechat", "weixin", "uiautomation", "rpa", "automation"]
dependencies = [
    "uiautomation>=2.0.18",
    "pywin32>=305",
    "pyperclip>=1.8.2",
    "Pillow>=9.0.0",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
    "cryptography>=41.0.0",
    "winsdk>=1.0.0b10",
]

[project.optional-dependencies]
guia = ["winsdk>=1.0.0b10", "pypinyin>=0.48.0"]

[project.urls]
Homepage = "https://wxauto.org"  # 上游 wxauto 项目主页（wechatauto 为其复刻版）

[tool.setuptools.packages.find]
include = ["wechatauto*"]

[tool.setuptools.package-data]
wechatauto = ["py.typed"]
